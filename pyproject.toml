[project]
name = "openstudy-ai"
version = "0.8.0"
description = "Plataforma adaptativa de aprendizagem com RAG, FSRS-6, IA multi-provedor e assistente conversacional via WhatsApp/Evolution API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "pydantic-settings>=2.7.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "jinja2>=3.1.5",
    "cryptography>=44.0.0",
    "fsrs>=6.0,<7",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
